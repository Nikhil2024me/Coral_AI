  <style>
    @keyframes diagonalScroll {

    .animated-coral-bg {
      background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCEA43Mr2bEvkaEUndqWysWgbhI3hOhxs76mOAKHPDjsPKewbVAITYTNI2kq1vgB7TyrIqcRSZgDuIK8qPHSBkdbb40seorjei3rniQjWAWuqfh_0m31mEVO5sF348lt3G1cjxrUguXhJzRswg0MhvWfVuVetdAPXuNnS0D30ZX-H6eCVLavuTG2X6o2QxRtkBDVEIiBsDPeJT0bywDLgGTo0DZzZ_XZ8pIaYcDQqR50_YyRwxAfhYLXnrw0qSFk1HFuA');

  <!-- Physics Engine and Interaction Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('physics-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const letters = ['C', 'o', 'r', 'a', 'l', '_', 'A', 'I', '!'];
      const blockColors = [
        { top: '#7928ca', bot: '#4c1d95', border: '#c084fc', glow: '#a855f7', text: '#ffffff' },
        { top: '#db2777', bot: '#831843', border: '#f472b6', glow: '#ec4899', text: '#ffffff' },
        { top: '#2563eb', bot: '#1e3a8a', border: '#60a5fa', glow: '#3b82f6', text: '#ffffff' },
        { top: '#9333ea', bot: '#581c87', border: '#d8b4fe', glow: '#a855f7', text: '#ffffff' },
        { top: '#0891b2', bot: '#164e63', border: '#67e8f9', glow: '#06b6d4', text: '#ffffff' },
        { top: '#475569', bot: '#1e293b', border: '#94a3b8', glow: '#cbd5e1', text: '#38bdf8' },
        { top: '#d946ef', bot: '#701a75', border: '#f0abfc', glow: '#e879f9', text: '#ffffff' },
        { top: '#6366f1', bot: '#312e81', border: '#a5b4fc', glow: '#818cf8', text: '#ffffff' },
        { top: '#f43f5e', bot: '#881337', border: '#fda4af', glow: '#fb7185', text: '#ffffff' }
      ];

      let width = 0;
      let height = 0;
      let dpr = window.devicePixelRatio || 1;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function roundRect(c, x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        c.beginPath();
        c.moveTo(x + r[0], y);
        c.lineTo(x + w - r[1], y);
        c.quadraticCurveTo(x + w, y, x + w, y + r[1]);
        c.lineTo(x + w, y + h - r[2]);
        c.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
        c.lineTo(x + r[3], y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r[3]);
        c.lineTo(x, y + r[0]);
        c.quadraticCurveTo(x, y, x + r[0], y);
        c.closePath();
      }

      class PhysicsBody {
        constructor(char, color, x, y, size) {
          this.char = char;
          this.color = color;
          this.x = x;
          this.y = y;
          this.size = size;
          this.half = size / 2;
          this.vx = (Math.random() - 0.5) * 6;
          this.vy = -Math.random() * 5 - 2;
          this.angle = (Math.random() - 0.5) * 0.4;
          this.va = (Math.random() - 0.5) * 0.08;
          this.mass = 1;
          this.restitution = 0.65;
          this.friction = 0.985;
          this.isHeld = false;
          this.grabOffsetX = 0;
          this.grabOffsetY = 0;
        }

        update(gravity, bounds) {
          if (this.isHeld) return;

          this.vy += gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.angle += this.va;

          this.vx *= this.friction;
          this.vy *= 0.995;
          this.va *= 0.97;

          // Floor
          if (this.y + this.half > bounds.height) {
            this.y = bounds.height - this.half;
            this.vy = -this.vy * this.restitution;
            this.vx *= 0.88;
            this.va *= 0.85;
            if (Math.abs(this.vy) < 0.2) this.vy = 0;
          }
          // Ceiling
          if (this.y - this.half < 0) {
            this.y = this.half;
            this.vy = -this.vy * this.restitution;
          }
          // Left wall
          if (this.x - this.half < 0) {
            this.x = this.half;
            this.vx = -this.vx * this.restitution;
            this.va += this.vy * 0.01;
          }
          // Right wall
          if (this.x + this.half > bounds.width) {
            this.x = bounds.width - this.half;
            this.vx = -this.vx * this.restitution;
            this.va -= this.vy * 0.01;
          }
        }

        draw(c) {
          c.save();
          c.translate(this.x, this.y);
          c.rotate(this.angle);

          const h = this.half;
          const w = this.size;
          const r = 10;

          const speed = Math.hypot(this.vx, this.vy);
          const glowAmount = this.isHeld ? 26 : Math.min(22, 6 + speed * 1.5);
          c.shadowColor = this.color.glow;
          c.shadowBlur = glowAmount;

          // Shadow base
          c.fillStyle = '#05030a';
          roundRect(c, -h + 4, -h + 4, w, w, r);
          c.fill();

          // Gradient letter block
          const grad = c.createLinearGradient(0, -h, 0, h);
          grad.addColorStop(0, this.color.top);
          grad.addColorStop(1, this.color.bot);
          c.fillStyle = grad;
          roundRect(c, -h, -h, w, w, r);
          c.fill();

          // Border
          c.shadowBlur = 0;
          c.lineWidth = this.isHeld ? 3.5 : 2;
          c.strokeStyle = this.isHeld ? '#ffffff' : this.color.border;
          roundRect(c, -h, -h, w, w, r);
          c.stroke();

          // Top highlight
          c.fillStyle = 'rgba(255, 255, 255, 0.22)';
          roundRect(c, -h + 3, -h + 3, w - 6, 8, [6, 6, 2, 2]);
          c.fill();

          // Scanlines
          c.fillStyle = 'rgba(0, 0, 0, 0.2)';
          for (let y = -h + 4; y < h - 4; y += 4) {
            c.fillRect(-h + 3, y, w - 6, 1.5);
          }

          // Letter character
          c.shadowColor = '#000000';
          c.shadowBlur = 4;
          c.shadowOffsetX = 2;
          c.shadowOffsetY = 2;
          c.fillStyle = this.color.text;
          c.font = `bold ${Math.round(this.size * 0.44)}px "Press Start 2P", monospace`;
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(this.char, 0, 2);

          // Arcade chassis bolts
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255, 255, 255, 0.6)';
          c.fillRect(-h + 5, -h + 5, 2.5, 2.5);
          c.fillRect(h - 7.5, -h + 5, 2.5, 2.5);
          c.fillRect(-h + 5, h - 7.5, 2.5, 2.5);
          c.fillRect(h - 7.5, h - 7.5, 2.5, 2.5);

          c.restore();
        }

        containsPoint(px, py) {
          const dx = px - this.x;
          const dy = py - this.y;
          const cos = Math.cos(-this.angle);
          const sin = Math.sin(-this.angle);
          const localX = cos * dx - sin * dy;
          const localY = sin * dx + cos * dy;
          return Math.abs(localX) <= this.half && Math.abs(localY) <= this.half;
        }
      }

      let bodies = [];

      function spawnBodies() {
        bodies = [];
        const isSmall = width < 600;
        const blockSize = isSmall ? 52 : Math.min(74, Math.floor(width / 11));
        const spacing = blockSize + 8;
        const totalWidth = letters.length * spacing;
        const startX = Math.max(blockSize, (width - totalWidth) / 2 + blockSize / 2);
        const startY = 80;

        letters.forEach((char, i) => {
          const x = startX + i * spacing + (Math.random() - 0.5) * 12;
          const y = startY + (i % 2 === 0 ? -25 : 25) + Math.random() * 20;
          const b = new PhysicsBody(char, blockColors[i % blockColors.length], x, y, blockSize);
          bodies.push(b);
        });
      }

      // Mutual Block Collisions
      function resolveCollisions() {
        for (let i = 0; i < bodies.length; i++) {
          for (let j = i + 1; j < bodies.length; j++) {
            const b1 = bodies[i];
            const b2 = bodies[j];
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = (b1.size + b2.size) * 0.48;

            if (dist < minDist && dist > 0.001) {
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;

              if (!b1.isHeld && !b2.isHeld) {
                b1.x -= nx * overlap * 0.5;
                b1.y -= ny * overlap * 0.5;
                b2.x += nx * overlap * 0.5;
                b2.y += ny * overlap * 0.5;
              } else if (b1.isHeld) {
                b2.x += nx * overlap;
                b2.y += ny * overlap;
              } else if (b2.isHeld) {
                b1.x -= nx * overlap;
                b1.y -= ny * overlap;
              }

              // Elastic response
              const kx = b1.vx - b2.vx;
              const ky = b1.vy - b2.vy;
              const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

              if (p > 0) {
                if (!b1.isHeld) {
                  b1.vx -= p * b2.mass * nx * 0.8;
                  b1.vy -= p * b2.mass * ny * 0.8;
                  b1.va += (Math.random() - 0.5) * 0.04;
                }
                if (!b2.isHeld) {
                  b2.vx += p * b1.mass * nx * 0.8;
                  b2.vy += p * b1.mass * ny * 0.8;
                  b2.va += (Math.random() - 0.5) * 0.04;
                }
              }
            }
          }
        }
      }

      // Mouse & Drag State
      let draggedBody = null;
      let prevMouseX = 0;
      let prevMouseY = 0;
      let mouseVelX = 0;
      let mouseVelY = 0;

      function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function onDown(e) {
        const pos = getCanvasPos(e);
        prevMouseX = pos.x;
        prevMouseY = pos.y;
        mouseVelX = 0;
        mouseVelY = 0;

        for (let i = bodies.length - 1; i >= 0; i--) {
          const b = bodies[i];
          if (b.containsPoint(pos.x, pos.y)) {
            draggedBody = b;
            b.isHeld = true;
            b.grabOffsetX = pos.x - b.x;
            b.grabOffsetY = pos.y - b.y;
            b.vx = 0;
            b.vy = 0;
            // Bring to top
            bodies.splice(i, 1);
            bodies.push(b);
            break;
          }
        }
      }

      function onMove(e) {
        const pos = getCanvasPos(e);
        mouseVelX = pos.x - prevMouseX;
        mouseVelY = pos.y - prevMouseY;
        prevMouseX = pos.x;
        prevMouseY = pos.y;

        if (draggedBody) {
          draggedBody.x = pos.x - draggedBody.grabOffsetX;
          draggedBody.y = pos.y - draggedBody.grabOffsetY;
          draggedBody.vx = mouseVelX * 0.8;
          draggedBody.vy = mouseVelY * 0.8;
          draggedBody.va = mouseVelX * 0.015;
        }
      }

      function onUp() {
        if (draggedBody) {
          draggedBody.isHeld = false;
          draggedBody.vx = Math.max(-25, Math.min(25, mouseVelX * 1.25));
          draggedBody.vy = Math.max(-25, Math.min(25, mouseVelY * 1.25));
          draggedBody = null;
        }
      }

      canvas.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      canvas.addEventListener('touchstart', onDown, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onUp);

      // Explosive force button
      document.getElementById('btn-explode')?.addEventListener('click', () => {
        bodies.forEach(b => {
          b.vx += (Math.random() - 0.5) * 35;
          b.vy = -Math.random() * 22 - 8;
          b.va += (Math.random() - 0.5) * 0.25;
        });
      });

      // Reset positions button
      document.getElementById('btn-reset')?.addEventListener('click', () => {
        spawnBodies();
      });

      // Spawn on load
      spawnBodies();

      // Main Physics Simulation Loop
      const gravity = 0.42;
      function loop() {
        ctx.clearRect(0, 0, width, height);

        const bounds = { width, height };
        bodies.forEach(b => b.update(gravity, bounds));
        resolveCollisions();
        bodies.forEach(b => b.draw(ctx));

        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>





</body></html>
